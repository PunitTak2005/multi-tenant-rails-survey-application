default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "multi_tenant_development" } %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB") { "multi_tenant_test" } %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("MULTI_TENANT_DATABASE") { "multi_tenant_production" } %>
    username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("MULTI_TENANT_CACHE_DATABASE") { "multi_tenant_production_cache" } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("MULTI_TENANT_QUEUE_DATABASE") { "multi_tenant_production_queue" } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("MULTI_TENANT_CABLE_DATABASE") { "multi_tenant_production_cable" } %>
    migrations_paths: db/cable_migrate
